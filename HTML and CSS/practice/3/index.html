<!DOCTYPE html>
<html>
<head>
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="images/logo.webp" alt="Myntra">
        </div>

        <ul class="nav-links">
            <li>Men</li>
            <li>Women</li>
            <li>Kids</li>
            <li>Home & Living</li>
            <li>Beauty</li>
        </ul>

        <input type="text" placeholder="Search for products..." class="search">

        <div class="icons">
            <span>Profile</span>
            <span>Wishlist</span>
            <span>Bag</span>
        </div>
    </header>

    <!-- Banner -->
    <section class="banner">
        <img src="images/banner1.jpg">
    </section>

    <!-- Products -->
    <section class="products">
        <div class="product-card">
            <img src="images/product1.jpg">
            <h4>H&M</h4>
            <p>Men Regular Fit T-Shirt</p>
            <p><span class="price">₹499</span> <span class="discount">50% OFF</span></p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Myntra Clone</p>
    </footer>

</body>
</html>
